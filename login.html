<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content"><title>登录 · 家居风水</title><link rel="stylesheet" href="/account.css"></head>
<body class="login-page">
<div class="residential-scene" aria-hidden="true"><img src="/assets/auth-residential-video-poster-v2.jpg" alt=""><video muted autoplay loop playsinline poster="/assets/auth-residential-video-poster-v2.jpg"></video></div>
<div class="auth-mobile-scene" aria-hidden="true"></div>
<div class="auth-brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="m3 10 9-8 9 8v12h-6v-8l-3-3-3 3v8H3Z"/></svg><span>家居风水</span></div>
<main class="login-card">
<div class="auth-card-heading">
<h1 id="authTitle">登录</h1>
</div>
<form id="authForm" novalidate>
<label for="login">账号<input id="login" name="login" required minlength="3" maxlength="64" autocomplete="username" inputmode="email" enterkeyhint="next" placeholder="请输入账号" autocapitalize="none" spellcheck="false" aria-describedby="loginError"><span class="field-error" id="loginError" hidden></span></label>
<div class="register-field" hidden>
<label for="displayName">显示名称<input id="displayName" name="name" maxlength="24" autocomplete="nickname" enterkeyhint="next" placeholder="请输入显示名称" aria-describedby="nameError"><span class="field-error" id="nameError" hidden></span></label>
<label for="inviteCode">邀请码<input id="inviteCode" name="inviteCode" maxlength="64" enterkeyhint="next" placeholder="请输入邀请码" autocapitalize="characters" spellcheck="false" aria-describedby="inviteError"><span class="field-error" id="inviteError" hidden></span></label>
</div>
<label for="password">密码<span class="password-field"><input id="password" name="password" type="password" required minlength="8" maxlength="72" autocomplete="current-password" enterkeyhint="go" placeholder="请输入密码" aria-describedby="passwordError"><button type="button" id="togglePassword" aria-label="显示密码" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></span><span class="field-error" id="passwordError" hidden></span></label>
<label class="register-field" for="confirmPassword" hidden>确认密码<input id="confirmPassword" name="confirm" type="password" minlength="8" maxlength="72" autocomplete="new-password" enterkeyhint="go" placeholder="请再次输入密码" aria-describedby="confirmError"><span class="field-error" id="confirmError" hidden></span></label>
<div class="auth-options"><button type="button" id="forgotPassword" class="auth-text-button">忘记密码？</button></div>
<button class="primary" id="submitAuth" type="submit"><span class="auth-spinner" aria-hidden="true" hidden></span><span id="submitLabel">登录</span><svg class="auth-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></button>
<p class="feedback" id="authFeedback" role="status" aria-live="polite" hidden></p>
</form>
<p class="auth-switch"><span id="switchHint">还没有账号？</span><a id="switchAuth" href="/register">注册账号 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></a></p>
</main>
<dialog id="recoveryDialog" aria-labelledby="recoveryTitle" aria-describedby="recoveryDescription">
<div class="dialog-heading"><h2 id="recoveryTitle">找回密码</h2><button type="button" class="close-button" id="closeRecovery" aria-label="关闭找回密码">×</button></div>
<p id="recoveryDescription">请联系管理员重置密码，并提供你的登录账号。</p>
<p class="recovery-account" id="recoveryAccount" hidden></p>
<p class="recovery-note">重置后，使用新密码登录即可。管理员账号请联系系统负责人恢复。</p>
<button type="button" class="primary" id="recoveryDone">返回登录</button>
</dialog>
<script type="module" src="/login.js"></script>
</body></html>
