<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家居风水 · 工作台</title><link rel="stylesheet" href="workspace.css?rev=7834241b52"><link rel="stylesheet" href="/plan-workflow.css?v=0.3.0"></head>
<body>
<header class="header"><div class="brand"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="16" cy="16" r="14"/><path d="M9 17l7-6 7 6M11 16v8h10v-8M15 24v-6h3v6"/></svg>家居风水</div><div class="modes" aria-label="空间类型"><button class="selected" aria-pressed="true">室内</button><button disabled title="室外功能暂未开放">室外</button></div><button class="account" id="accountButton" aria-label="我的账户" aria-expanded="false"><span class="avatar">用</span><span>我的账户</span><svg viewBox="0 0 20 20"><path d="m6 8 4 4 4-4"/></svg></button></header>
<div class="layout">
<nav class="rail mobile-dock" aria-label="主导航"><button class="selected" id="work" aria-current="page"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 10l9-7 9 7v11H3zM9 21v-8h6v8"/></svg></span><span>工作台</span></button><button id="history"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/></svg></span><span>历史记录</span></button><div class="rail-tools"><div class="toolbar"><div class="popover-anchor"><button id="layersButton" aria-label="图层" title="图层" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M3 8l9-5 9 5-9 5zM3 12l9 5 9-5M3 16l9 5 9-5"/></svg><span class="tool-label">图层</span><svg class="chevron" viewBox="0 0 20 20"><path d="m6 12 4-4 4 4"/></svg></button><div class="layers-pop" id="layersPop" hidden></div></div><div class="scale-anchor"><button id="sizeButton" aria-label="大小" title="大小" aria-expanded="false" aria-controls="sizePop"><svg viewBox="0 0 24 24"><path d="M9 3H3v6M15 3h6v6M3 15v6h6M21 15v6h-6M3 3l6 6M21 3l-6 6M3 21l6-6M21 21l-6-6"/></svg><span class="tool-label">大小</span></button><div class="scale-pop" id="sizePop" hidden><div class="rail-zoom"><button id="zoomOut" aria-label="缩小"><svg viewBox="0 0 20 20"><path d="M5 10h10"/></svg></button><button id="zoom" aria-label="适应窗口缩放比例">100%</button><button id="zoomIn" aria-label="放大"><svg viewBox="0 0 20 20"><path d="M5 10h10M10 5v10"/></svg></button></div><button class="fit-window" id="fitWindow">适应窗口</button></div></div></div></div></nav>
<main class="workspace" id="workspace"><div class="canvas-head"><span id="angleReadout" hidden>北向校准<strong id="readout">0.0°</strong></span></div><div class="canvas-wrap"><svg id="luopan" class="luopan" viewBox="0 0 800 800" role="img" aria-label="风水罗盘，地盘正针二十四山，后天八卦，南上北下"></svg><div class="center-action" id="upload"><button class="primary upload-button motion-cta" id="uploadButton"><span class="upload-icon"><svg viewBox="0 0 24 24"><path d="M12 16V3m-4 4l4-4 4 4M4 14v6h16v-6"/></svg></span><span class="action-label">上传户型图</span></button><button class="primary motion-cta" id="analyzeImage" onclick="requestAnalysis()" hidden><span class="action-label">确认分析家居图</span><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button></div></div>
<div class="canvas-controls"><div class="file-action" id="fileAction" hidden><button id="replaceImage" aria-label="更换图片">更换</button><i></i><button id="deleteImage" class="danger" aria-label="删除图片">删除</button></div></div>
</main><aside class="inspector" id="inspector" hidden></aside><section class="collection" id="historyPage" hidden></section></div>
<div class="account-pop" id="accountPop" hidden><strong>我的账户</strong><p>账号服务尚未接入，当前页面中的图片和历史记录仅保留在本次会话。</p></div>
<dialog id="analysisDialog" aria-labelledby="analysisTitle"><div class="panel-heading"><h2 id="analysisTitle">分析家居图</h2><button class="icon-button" id="closeAnalysis" aria-label="关闭分析确认"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div class="analysis-file"><img id="analysisThumb" alt="待分析户型图"><div><strong id="analysisName"></strong></div></div><p class="confirmation-copy">请确认已选择正确的户型图。</p><p id="analysisError" class="form-error" role="alert" hidden></p><div class="dialog-actions"><button class="neutral-button" id="cancelAnalysis">返回调整</button><button class="primary" id="confirmAnalysis">确认分析</button></div></dialog>
<dialog class="mobile-tools" id="mobileTools" aria-labelledby="mobileToolTitle"><div class="sheet-handle" aria-hidden="true"></div><div class="sheet-heading"><h2 id="mobileToolTitle"></h2><button id="closeMobileTools" class="icon-button" aria-label="关闭工具面板"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div id="mobileToolContent"></div></dialog>
<input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp" hidden><div id="toast" class="toast" role="status" hidden></div>
