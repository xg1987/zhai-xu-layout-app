<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理后台 · 家居风水</title><link rel="stylesheet" href="/account.css"></head><body>
<header class="admin-header"><a class="admin-brand" href="/admin"><span class="brand-mark">宅</span><span>管理后台</span></a><div class="admin-header-actions"><span id="adminName"></span><a href="/">用户工作台</a><button class="text-button" id="adminLogout">退出</button></div></header>
<main class="admin-layout"><div class="admin-greeting"><div><h1>账户与访问</h1><p>管理用户、审核申请与注册邀请</p></div></div><div class="metrics"><div class="metric"><span>全部账号</span><b id="totalUsers">—</b></div><div class="metric"><span>待审核申请</span><b id="pendingUsers">—</b></div><div class="metric"><span>可用账号</span><b id="enabledUsers">—</b></div></div>
<nav class="admin-tabs" role="tablist" aria-label="管理功能"><button role="tab" aria-selected="true" aria-controls="usersSection" data-tab="users">账号管理</button><button role="tab" aria-selected="false" aria-controls="invitationsSection" data-tab="invitations">邀请码</button><button role="tab" aria-selected="false" aria-controls="eventsSection" data-tab="events">操作记录</button></nav>
<p id="adminFeedback" class="feedback" role="alert" hidden></p>
<section id="usersSection" role="tabpanel" aria-label="账号管理"><div class="section-toolbar"><form id="searchUsers" class="search"><input name="q" aria-label="搜索账号或名称" placeholder="搜索账号或名称" maxlength="64"><button class="secondary" type="submit">搜索</button></form><button class="primary" id="newAccount">＋ 新建账号</button></div><div id="usersList" class="records"></div><div class="pagination"><button class="secondary" id="previousPage">上一页</button><span id="pageLabel"></span><button class="secondary" id="nextPage">下一页</button></div></section>
<section id="invitationsSection" role="tabpanel" aria-label="邀请码" hidden><form id="inviteForm" class="invite-form"><label>邀请名称<input name="name" required maxlength="40" placeholder="如：首批用户"></label><label>有效天数<input name="days" type="number" min="1" max="90" value="7" required></label><label>使用次数<input name="maxUses" type="number" min="1" max="100" value="1" required></label><button class="primary" type="submit">生成邀请码</button></form><div id="inviteResult" class="invite-result" hidden><strong>邀请码已生成</strong><code id="newInviteCode"></code><p>完整邀请码仅在本次生成后显示，请保存并提供给受邀用户。</p><button id="copyInvite" class="secondary">复制邀请码</button></div><div id="invitesList" class="records"></div></section>
<section id="eventsSection" role="tabpanel" aria-label="操作记录" hidden><div id="eventsList" class="records"></div></section></main>
<dialog id="accountDialog" aria-labelledby="accountDialogTitle"><div class="dialog-heading"><h2 id="accountDialogTitle">新建账号</h2><button id="closeAccount" class="close-button" aria-label="关闭新建账号">×</button></div><form id="accountForm"><label>登录账号<input name="login" minlength="3" maxlength="64" autocomplete="off" required></label><label>显示名称<input name="name" maxlength="24" required></label><label>账号角色<select name="role"><option value="user">普通用户</option><option value="admin">管理员</option></select></label><label>初始密码<input name="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required></label><p id="accountError" class="feedback" role="alert" hidden></p><button class="primary" type="submit">创建账号</button></form></dialog>
<script type="module" src="/admin.js"></script></body></html>
