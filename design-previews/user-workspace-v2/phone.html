<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>家居风水 · 手机预览</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px;background:#f0f1ed}
    .phone{width:min(390px,100%);height:min(844px,calc(100dvh - 40px));overflow:hidden;border:1px solid #e2e5dd;border-radius:28px;background:white;box-shadow:0 12px 50px #29302414}
    iframe{display:block;width:100%;height:100%;border:0}
    @media(max-width:430px){body{padding:0}.phone{width:100%;height:100dvh;border:0;border-radius:0;box-shadow:none}}
  </style>
</head>
<body><div class="phone"><iframe src="./index.html" title="家居风水手机工作台"></iframe></div></body>
</html>
